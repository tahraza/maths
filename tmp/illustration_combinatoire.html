<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Illustration interactive – Combinatoire & dénombrement (SVG)</title>
  <style>
    :root {
      --bg: #0e0f14;
      --panel: #141722;
      --grid: rgba(255,255,255,.10);
      --axis: rgba(255,255,255,.45);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --blue: #4aa3ff;
      --yellow: #ffd166;
      --red: #ff5c7a;
      --green: #52e3b6;
    }
    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 20% 20%, #151a2b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 16px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; width: 100%; }
    .top {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 980px) {
      .top { grid-template-columns: 2fr 1fr; align-items: start; }
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .card h1 {
      font-size: 16px;
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      color: var(--text);
      letter-spacing: .2px;
    }
    .panel {
      padding: 12px 14px;
      background: rgba(0,0,0,.08);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }
    .row label { color: var(--muted); font-size: 12px; }
    input[type="range"] { width: 100%; }
    select { width: 100%; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.06); color: var(--text); border: 1px solid rgba(255,255,255,.14); }
    .btns {
      display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;
    }
    button {
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.10); }
    .small { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .kv {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: rgba(255,255,255,.92);
      background: rgba(0,0,0,.20);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      margin: 10px 0 0;
      white-space: pre-wrap;
    }
    .legend {
      display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 14px;
      border-top: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-size: 12px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .hint { opacity: .9; }
  </style>
</head>
<body>
  <div class="wrap top">
    <div class="card">
      <h1>Combinatoire — choisir k objets parmi n (avec / sans ordre)</h1>

      <svg id="svg" viewBox="0 0 900 560" width="100%" height="auto" style="display:block;background:transparent">
        <defs>
          <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="rgba(255,255,255,.55)"></path>
          </marker>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Top: set of n items -->
        <text x="30" y="44" fill="rgba(255,255,255,.82)" font-size="14">Ensemble de départ (n objets)</text>
        <g id="pool"></g>

        <!-- Arrow to selection -->
        <line x1="450" y1="210" x2="450" y2="265" stroke="rgba(255,255,255,.35)" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Bottom left: chosen subset (combination) -->
        <text x="30" y="310" fill="rgba(255,255,255,.82)" font-size="14">Choix (k objets)</text>
        <g id="chosen"></g>

        <!-- Bottom right: ordered slots (permutation/arrangement) -->
        <text x="520" y="310" fill="rgba(255,255,255,.82)" font-size="14">Si l’ordre compte : k places</text>
        <g id="slots"></g>

        <!-- Info corner -->
        <g transform="translate(20,430)">
          <rect x="0" y="0" width="860" height="110" rx="14" fill="rgba(0,0,0,.20)" stroke="rgba(255,255,255,.10)"/>
          <text id="info1" x="14" y="28" fill="rgba(255,255,255,.92)" font-size="15"></text>
          <text id="info2" x="14" y="54" fill="rgba(255,255,255,.82)" font-size="13"></text>
          <text id="info3" x="14" y="78" fill="rgba(255,255,255,.82)" font-size="13"></text>
          <text id="info4" x="14" y="102" fill="rgba(255,255,255,.82)" font-size="13"></text>
        </g>
      </svg>

      <div class="legend">
        <div><span class="dot" style="background:var(--blue)"></span>Objets disponibles</div>
        <div><span class="dot" style="background:var(--yellow)"></span>Objets sélectionnés</div>
        <div><span class="dot" style="background:var(--red)"></span>Places (si l’ordre compte)</div>
      </div>
    </div>

    <div class="card">
      <h1>Contrôles</h1>
      <div class="panel">
        <div class="row">
          <label for="n">n (taille de l’ensemble)</label>
          <output id="on">8</output>
        </div>
        <input id="n" type="range" min="1" max="12" step="1" value="8"/>

        <div class="row">
          <label for="k">k (nombre d’objets choisis)</label>
          <output id="ok">3</output>
        </div>
        <input id="k" type="range" min="0" max="12" step="1" value="3"/>

        <div class="row">
          <label for="mode">Mode</label>
          <output id="omode">Combinaisons</output>
        </div>
        <select id="mode">
          <option value="comb">Combinaisons (ordre ne compte pas)</option>
          <option value="arr">Arrangements (ordre compte)</option>
          <option value="perm">Permutations (k = n)</option>
        </select>

        <div class="btns">
          <button id="shuffle">🎲 Tirage aléatoire</button>
          <button id="animate">▶︎ Animer</button>
          <button id="reset">↺ Reset</button>
        </div>

        <div class="small hint" style="margin-top:10px">
          <b>Idée clé :</b><br/>
          • Si l’ordre ne compte pas → <b>C(n,k)</b><br/>
          • Si l’ordre compte → <b>A(n,k)</b> (ou P(n) si k=n)
        </div>

        <div id="kv" class="kv"></div>
      </div>
    </div>
  </div>

<script>
  // ---------- BigInt combinatorics helpers ----------
  const big = (x) => BigInt(x);

  function fact(n){
    n = BigInt(n);
    let r = 1n;
    for(let i=2n;i<=n;i++) r *= i;
    return r;
  }

  // nPk (arrangements): n*(n-1)*...*(n-k+1)
  function arrangements(n,k){
    n=BigInt(n); k=BigInt(k);
    if(k<0n || k>n) return 0n;
    let r = 1n;
    for(let i=0n;i<k;i++) r *= (n - i);
    return r;
  }

  // nCk: fact(n)/(fact(k)*fact(n-k)) computed safely
  function combinations(n,k){
    n=BigInt(n); k=BigInt(k);
    if(k<0n || k>n) return 0n;
    // symmetry
    if(k > n-k) k = n-k;
    let num = 1n, den = 1n;
    for(let i=1n;i<=k;i++){
      num *= (n - (k - i));
      den *= i;
      // reduce occasionally (gcd) to keep numbers smaller
      const g = gcd(num, den);
      num /= g; den /= g;
    }
    return num / den;
  }

  function gcd(a,b){
    a = a<0n? -a : a;
    b = b<0n? -b : b;
    while(b !== 0n){
      const t = a % b;
      a = b; b = t;
    }
    return a;
  }

  function fmtBig(x){
    const s = x.toString();
    // add thin spaces
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  // ---------- SVG drawing ----------
  const el = {
    n: document.getElementById("n"),
    k: document.getElementById("k"),
    mode: document.getElementById("mode"),
    on: document.getElementById("on"),
    ok: document.getElementById("ok"),
    omode: document.getElementById("omode"),
    pool: document.getElementById("pool"),
    chosen: document.getElementById("chosen"),
    slots: document.getElementById("slots"),
    info1: document.getElementById("info1"),
    info2: document.getElementById("info2"),
    info3: document.getElementById("info3"),
    info4: document.getElementById("info4"),
    kv: document.getElementById("kv"),
    shuffle: document.getElementById("shuffle"),
    animate: document.getElementById("animate"),
    reset: document.getElementById("reset"),
  };

  let selected = [];     // array of indices [0..n-1], length k
  let order = [];        // ordered list (for arrangements)
  let anim = false;
  let raf = null;
  let t0 = 0;

  const NS = "http://www.w3.org/2000/svg";

  function circle(x,y,r,fill,stroke="rgba(255,255,255,.18)", sw=1.5){
    const c = document.createElementNS(NS,"circle");
    c.setAttribute("cx",x); c.setAttribute("cy",y);
    c.setAttribute("r",r);
    c.setAttribute("fill",fill);
    c.setAttribute("stroke",stroke);
    c.setAttribute("stroke-width",sw);
    return c;
  }
  function text(x,y,txt,size=12,fill="rgba(255,255,255,.92)"){
    const t = document.createElementNS(NS,"text");
    t.setAttribute("x",x); t.setAttribute("y",y);
    t.setAttribute("font-size",size);
    t.setAttribute("fill",fill);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","central");
    t.textContent = txt;
    return t;
  }
  function rect(x,y,w,h,rx,fill,stroke="rgba(255,255,255,.14)"){
    const r = document.createElementNS(NS,"rect");
    r.setAttribute("x",x); r.setAttribute("y",y);
    r.setAttribute("width",w); r.setAttribute("height",h);
    r.setAttribute("rx",rx);
    r.setAttribute("fill",fill);
    r.setAttribute("stroke",stroke);
    return r;
  }

  function randInt(a,b){ // inclusive
    return a + Math.floor(Math.random()*(b-a+1));
  }

  function sampleWithoutReplacement(n,k){
    const arr = [...Array(n).keys()];
    for(let i=arr.length-1;i>0;i--){
      const j = randInt(0,i);
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr.slice(0,k);
  }

  function updateSelection(){
    const n = +el.n.value;
    const k = +el.k.value;
    const mode = el.mode.value;

    // enforce bounds
    el.k.max = String(n);
    if(+el.k.value > n) el.k.value = n;

    // mode perm forces k=n
    if(mode === "perm"){
      el.k.value = n;
      el.k.disabled = true;
    } else {
      el.k.disabled = false;
    }

    el.on.textContent = el.n.value;
    el.ok.textContent = el.k.value;
    el.omode.textContent = (mode==="comb" ? "Combinaisons" : (mode==="arr" ? "Arrangements" : "Permutations"));

    // keep selection size consistent
    const kk = +el.k.value;
    if(selected.length !== kk || selected.some(v => v>=n)){
      selected = sampleWithoutReplacement(n, kk);
    }
    // order = a shuffled version of selected (for arrangements)
    order = [...selected];
    shuffleArray(order);

    render();
  }

  function shuffleArray(a){
    for(let i=a.length-1;i>0;i--){
      const j = randInt(0,i);
      [a[i],a[j]] = [a[j],a[i]];
    }
  }

  function render(){
    const n = +el.n.value;
    const k = +el.k.value;
    const mode = el.mode.value;

    el.pool.innerHTML = "";
    el.chosen.innerHTML = "";
    el.slots.innerHTML = "";

    // positions for pool circles (2 rows up to 12)
    const startX = 60, startY = 90, dx = 70, dy = 70;
    for(let i=0;i<n;i++){
      const row = Math.floor(i/6);
      const col = i%6;
      const x = startX + col*dx;
      const y = startY + row*dy;

      const isSel = selected.includes(i);
      const fill = isSel ? "var(--yellow)" : "var(--blue)";
      const c = circle(x,y,20,fill, isSel ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.18)", 1.8);
      if(isSel) c.setAttribute("filter","url(#glow)");
      el.pool.appendChild(c);
      el.pool.appendChild(text(x,y,String(i+1),13, "rgba(0,0,0,.75)"));
    }

    // chosen subset display
    const cx0 = 60, cy0 = 360;
    for(let j=0;j<k;j++){
      const i = selected[j];
      const x = cx0 + j*70;
      const y = cy0;
      el.chosen.appendChild(circle(x,y,22,"var(--yellow)","rgba(255,255,255,.35)",1.8));
      el.chosen.appendChild(text(x,y,String(i+1),13,"rgba(0,0,0,.75)"));
    }
    if(k===0){
      el.chosen.appendChild(text(120,360,"∅",18,"rgba(255,255,255,.65)"));
    }

    // ordered slots (only meaningful if order counts)
    const showSlots = (mode !== "comb");
    const sx0 = 540, sy0 = 340;
    for(let j=0;j<Math.max(k,1);j++){
      const x = sx0 + (j%4)*80;
      const y = sy0 + Math.floor(j/4)*80;
      // slot box
      const box = rect(x,y,58,58,12,"rgba(255,92,122,.12)","rgba(255,92,122,.35)");
      el.slots.appendChild(box);
      el.slots.appendChild(text(x+29,y+8,String(j+1),10,"rgba(255,255,255,.60)"));

      if(showSlots && j<k){
        const item = order[j];
        const cc = circle(x+29,y+33,18,"var(--yellow)","rgba(255,255,255,.35)",1.6);
        el.slots.appendChild(cc);
        el.slots.appendChild(text(x+29,y+33,String(item+1),12,"rgba(0,0,0,.75)"));
      } else if(!showSlots){
        // hint
        if(j===0){
          el.slots.appendChild(text(700,380,"(ordre ignoré)",14,"rgba(255,255,255,.55)"));
        }
      }
    }

    // compute counts
    const Cnk = combinations(n,k);
    const Ank = arrangements(n,k);
    const Pn  = fact(n);

    let count, formula, interpretation;
    if(mode === "comb"){
      count = Cnk;
      formula = `C(n,k) = n! / (k!(n−k)!)`;
      interpretation = "On compte les sous-ensembles de taille k.";
    } else if(mode === "arr"){
      count = Ank;
      formula = `A(n,k) = n(n−1)…(n−k+1) = n!/(n−k)!`;
      interpretation = "On remplit k places avec k objets distincts.";
    } else { // perm
      count = Pn;
      formula = `P(n) = n!`;
      interpretation = "On ordonne tous les n objets.";
    }

    // info box
    el.info1.textContent = `Paramètres : n=${n}, k=${k} — mode : ${el.omode.textContent}`;
    el.info2.textContent = `Sélection affichée : { ${selected.map(i=>i+1).join(", ")} }` + (mode==="comb" ? "" : `  → ordre : [ ${order.map(i=>i+1).join(", ")} ]`);
    el.info3.textContent = `Formule : ${formula}`;
    el.info4.textContent = `Nombre de cas : ${fmtBig(count)}  (${interpretation})`;

    // kv explanation
    el.kv.textContent =
`Rappels (sans répétition) :
• Combinaisons : C(n,k) = n! / (k!(n−k)!)
• Arrangements : A(n,k) = n! / (n−k)!
• Permutations : P(n) = n!

Ici :
n = ${n}
k = ${k}
=> résultat = ${fmtBig(count)}`;
  }

  function step(ts){
    if(!anim) return;
    if(!t0) t0 = ts;
    const dt = ts - t0;
    // every 450ms: reshuffle order + maybe new sample
    if(dt > 450){
      t0 = ts;
      const n = +el.n.value;
      const k = +el.k.value;
      // keep same subset but animate order in arrangement/permutation; in comb, animate subset
      if(el.mode.value === "comb"){
        selected = sampleWithoutReplacement(n,k);
      } else {
        order = [...selected];
        shuffleArray(order);
      }
      render();
    }
    raf = requestAnimationFrame(step);
  }

  // events
  el.n.addEventListener("input", updateSelection);
  el.k.addEventListener("input", updateSelection);
  el.mode.addEventListener("change", updateSelection);

  el.shuffle.addEventListener("click", () => {
    const n = +el.n.value;
    const k = +el.k.value;
    selected = sampleWithoutReplacement(n,k);
    order = [...selected]; shuffleArray(order);
    render();
  });

  el.animate.addEventListener("click", () => {
    anim = !anim;
    el.animate.textContent = anim ? "⏸︎ Stop" : "▶︎ Animer";
    t0 = 0;
    if(anim) raf = requestAnimationFrame(step);
    else if(raf) cancelAnimationFrame(raf);
  });

  el.reset.addEventListener("click", () => {
    anim = false;
    el.animate.textContent = "▶︎ Animer";
    if(raf) cancelAnimationFrame(raf);
    el.n.value = 8;
    el.k.value = 3;
    el.mode.value = "comb";
    selected = [];
    updateSelection();
  });

  // init
  updateSelection();
</script>
</body>
</html>
